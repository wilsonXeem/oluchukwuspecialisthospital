<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">+</div>
      <div>
        <div class="brand-name">Oluchukwu Specialist Hospital</div>
        <div class="brand-sub">Content Management Portal</div>
      </div>
    </div>

    <h2 class="login-title">Sign In</h2>
    <p class="login-sub">Enter your credentials to manage the hospital website</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email Address</label>
        <input formControlName="email" type="email" placeholder="your@email.com" autocomplete="email">
        <div class="field-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Enter a valid email address
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path *ngIf="!showPassword" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle *ngIf="!showPassword" cx="12" cy="12" r="3"/>
              <path *ngIf="showPassword" d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-login" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
