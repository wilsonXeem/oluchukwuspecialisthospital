<div class="barcode-scanner">
      <div class="scanner-header">
        <h5>Barcode Scanner</h5>
        <button class="btn btn-sm btn-outline-secondary" (click)="toggleScanner()">
          {{ isScanning ? 'Stop' : 'Start' }} Scanner
        </button>
      </div>

      <div class="scanner-content">
        <div *ngIf="!isScanning" class="scanner-placeholder">
          <i class="fas fa-barcode fa-3x text-muted"></i>
          <p class="text-muted mt-2">Click "Start Scanner" to begin</p>
          
          <div class="mt-3">
            <label class="btn btn-outline-primary">
              <i class="fas fa-image"></i> Scan from Image
              <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden>
            </label>
          </div>
        </div>

        <div *ngIf="isScanning" class="scanner-active">
          <video #videoElement autoplay playsinline class="scanner-video"></video>
          <div class="scanner-overlay">
            <div class="scan-line"></div>
          </div>
        </div>

        <div *ngIf="lastResult" class="scan-result mt-3">
          <div class="alert alert-success">
            <h6><i class="fas fa-check-circle"></i> Barcode Detected</h6>
            <p><strong>Code:</strong> {{ lastResult.code }}</p>
            <p><strong>Format:</strong> {{ lastResult.format }}</p>
            <p><strong>Time:</strong> {{ lastResult.timestamp | date:'medium' }}</p>
          </div>
        </div>
      </div>
    </div>
